services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petroil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petroil}
      POSTGRES_DB: ${POSTGRES_DB:-petroil}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petroil} -d ${POSTGRES_DB:-petroil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petroil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petroil}
      POSTGRES_DB: ${POSTGRES_DB:-petroil}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
