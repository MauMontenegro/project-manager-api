services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petroil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petroil}
      POSTGRES_DB: ${POSTGRES_DB:-petroil}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petroil} -d ${POSTGRES_DB:-petroil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petroil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petroil}
      POSTGRES_DB: ${POSTGRES_DB:-petroil}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LOCAL_ID_USUARIO: ${LOCAL_ID_USUARIO:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SECRET_KEY: ${SECRET_KEY:-}
      SESION_HORAS: ${SESION_HORAS:-12}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-[]}
      ASISTENTE_URL: ${ASISTENTE_URL:-}
      ASISTENTE_CLAVE: ${ASISTENTE_CLAVE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
